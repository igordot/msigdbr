url: https://igordot.github.io/msigdbr/

template:
  bootstrap: 5
  bootswatch: zephyr
  includes:
    after_body: >
      <script data-goatcounter="https://igordot.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  opengraph:
    twitter:
      creator: "@bioigor"
      card: summary_large_image

navbar:
  # zephyr navbar is blue by default
  bg: light
  structure:
    left: [intro, articles, reference, news]
  components:
    home: ~
    intro:
      text: Get started
      href: articles/msigdbr-intro.html
    articles:
      text: HS/MM databases
      href: articles/hs-mm.html

home:
  title: MSigDB R data frame
